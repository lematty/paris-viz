name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**/.claude/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**/.claude/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # data is generated at build time; cache the 160 MB GTFS download
      # (feed changes continuously, monthly staleness is fine for CI)
      - id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: data/
          key: idfm-gtfs-${{ steps.month.outputs.m }}

      - run: pnpm build

      - run: pnpm --filter site exec playwright install --with-deps chromium

      - run: pnpm --filter site exec playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: apps/site/test-results/
          retention-days: 7
          if-no-files-found: ignore
